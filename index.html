<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 Folium Library - Book Catalog</title>
    <style>
      :root {
        --primary: #0066cc;
        --success: #28a745;
        --danger: #d9534f;
        --secondary: #6c757d;
        --border: #e0e0e0;
        --bg-light: #f8f9fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
        color: #333;
        background-color: #fdfdfd;
      }

      h1 {
        font-size: 1.6rem;
        margin-top: 0.5rem;
        color: #111;
      }

      h2 {
        font-size: 1.25rem;
        margin-top: 1.5rem;
        color: #222;
      }

      /* Form Layout */
      form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      @media (min-width: 600px) {
        form {
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
      }

      input, select, button {
        padding: 0.75rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        width: 100%;
      }

      button {
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s ease, opacity 0.2s ease;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button:active:not(:disabled) {
        opacity: 0.8;
      }

      .submit-btn {
        background: var(--primary);
        color: white;
        border: none;
      }

      /* Controls */
      .controls {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        user-select: none;
        font-size: 0.95rem;
        padding: 0.25rem 0;
      }

      .checkbox-label input {
        width: 18px;
        height: 18px;
      }

      @media (min-width: 600px) {
        .controls {
          flex-direction: row;
          align-items: center;
          flex-wrap: wrap;
        }

        .controls input[type="text"] {
          flex: 2;
          min-width: 180px;
        }

        .controls select {
          flex: 1;
          min-width: 130px;
        }

        .controls button {
          width: auto;
        }
      }

      /* Responsive Table -> Card Layout */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      th, td {
        border: 1px solid var(--border);
        padding: 10px;
        text-align: left;
      }

      th {
        background-color: var(--bg-light);
      }

      /* Mobile Card Transformations for Table */
      @media (max-width: 600px) {
        table, thead, tbody, th, td, tr {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          margin-bottom: 1rem;
          border: 1px solid var(--border);
          border-radius: 8px;
          background: #fff;
          box-shadow: 0 1px 4px rgba(0,0,0,0.05);
          padding: 0.5rem 0.75rem;
        }

        td {
          border: none;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0.5rem 0;
          border-bottom: 1px solid #f0f0f0;
          font-size: 0.95rem;
        }

        td:last-child {
          border-bottom: none;
          padding-top: 0.75rem;
        }

        td:last-child::before {
          display: none;
        }

        td[colspan] {
          display: block;
          justify-content: center;
          text-align: center;
        }

        td[colspan]::before {
          display: none;
        }

        td::before {
          content: attr(data-label);
          font-weight: bold;
          color: #666;
          font-size: 0.85rem;
          padding-right: 0.5rem;
        }

        td button {
          width: 100%;
          padding: 0.6rem;
        }
      }

      /* Pagination Controls */
      .pagination-container {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        margin-top: 1rem;
        padding: 0.5rem 0;
      }

      .pagination-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .pagination-controls button {
        width: auto;
        padding: 0.5rem 0.8rem;
        font-size: 0.9rem;
      }

      .page-info {
        font-size: 0.9rem;
        color: #555;
      }

      .items-per-page {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        color: #555;
      }

      .items-per-page select {
        width: auto;
        padding: 0.4rem;
        font-size: 0.9rem;
      }

      @media (min-width: 600px) {
        .pagination-container {
          flex-direction: row;
        }
      }

      /* Modal Styling */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        justify-content: center;
        align-items: center;
        padding: 1rem;
        z-index: 1000;
      }

      .modal-box {
        background: white;
        padding: 1.5rem;
        border-radius: 10px;
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      }

      .modal-actions {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 0.5rem;
      }

      .modal-actions button {
        width: auto;
        padding: 0.6rem 1.2rem;
      }
    </style>
  </head>
  <body>
    <h1>📖 Sumadhura Folium Society Book Library</h1>

    <h2>Add a Book</h2>
    <form id="bookForm">
      <input type="text" id="title" placeholder="Book Title" required />
      <input type="text" id="author" placeholder="Author" />
      <input type="text" id="genre" placeholder="Genre (e.g. Fiction, Sci-Fi)" />
      <input type="text" id="addedByFlat" placeholder="Your Flat No. (e.g. B-204)" required />
      <button type="submit" id="submitBtn" class="submit-btn">Add Book to Library</button>
    </form>

    <h2>Book Catalog</h2>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search book title..." />
      <select id="genreFilter"><option value="">All Genres</option></select>
      <label class="checkbox-label">
        <input type="checkbox" id="availableOnlyToggle" />
        Available Only
      </label>
      <button type="button" onclick="loadBooks()">Refresh</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Book Title</th>
          <th>Author</th>
          <th>Genre</th>
          <th>Added By</th>
          <th>Status</th>
          <th>Borrower</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="booksTableBody"></tbody>
    </table>

    <!-- Pagination UI -->
    <div class="pagination-container">
      <div class="items-per-page">
        <label for="itemsPerPage">Rows per page:</label>
        <select id="itemsPerPage">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="all">All</option>
        </select>
      </div>

      <div class="pagination-controls">
        <button id="prevPageBtn" onclick="changePage(-1)">Previous</button>
        <span class="page-info" id="pageInfo">Page 1 of 1</span>
        <button id="nextPageBtn" onclick="changePage(1)">Next</button>
      </div>
    </div>

    <!-- Borrow Modal -->
    <div class="modal-overlay" id="borrowModal">
      <div class="modal-box">
        <h3 style="margin: 0;">Borrow Book</h3>
        <p id="modalBookTitle" style="margin: 0; font-size: 0.9rem; color: #666;"></p>
        <input type="text" id="flatNumber" placeholder="Flat No. (e.g. A-402)" required />
        <div class="modal-actions">
          <button type="button" onclick="closeModal()">Cancel</button>
          <button type="button" id="confirmBorrowBtn" style="background:var(--success); color:white; border:none;">Confirm</button>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbzGIsnWP3E2OL5X2sjz1CSV92imrxDRYimw4L0BAlO4igFAOtM-6CgGoNA_juyvdMxS/exec";
      let allBooks = [];
      let activeBook = null;

      // Pagination state variables
      let currentPage = 1;
      let itemsPerPage = 10;

      async function loadBooks() {
        const tbody = document.getElementById("booksTableBody");
        tbody.innerHTML = "<tr><td colspan='7' style='text-align: center; padding: 1rem;'>Loading catalog...</td></tr>";
        try {
          const res = await fetch(API_URL);
          allBooks = await res.json();
          populateGenres(allBooks);
          renderCatalog();
        } catch (err) {
          tbody.innerHTML = "<tr><td colspan='7' style='text-align: center; color: var(--danger); padding: 1rem;'>Error loading catalog.</td></tr>";
        }
      }

      function populateGenres(books) {
        const select = document.getElementById("genreFilter");
        const current = select.value;
        const genres = [...new Set(books.map(b => b.genre).filter(Boolean))].sort();
        select.innerHTML = '<option value="">All Genres</option>' + genres.map(g => `<option value="${g}">${g}</option>`).join("");
        select.value = current;
      }

      function renderCatalog() {
        const tbody = document.getElementById("booksTableBody");
        const search = document.getElementById("searchInput").value.toLowerCase().trim();
        const genre = document.getElementById("genreFilter").value.toLowerCase();
        const onlyAvailable = document.getElementById("availableOnlyToggle").checked;

        const filtered = allBooks.filter(b => {
          const matchesSearch = (b.title || "").toLowerCase().includes(search);
          const matchesGenre = !genre || (b.genre || "").toLowerCase() === genre;
          const matchesAvailability = !onlyAvailable || (b.status || "Available") === "Available";
          return matchesSearch && matchesGenre && matchesAvailability;
        });

        if (!filtered.length) {
          tbody.innerHTML = "<tr><td colspan='7' style='text-align: center; padding: 1rem;'>No matching books found.</td></tr>";
          updatePaginationControls(0);
          return;
        }

        // Calculate Pagination Slices
        const totalItems = filtered.length;
        const isAll = itemsPerPage === "all";
        const limit = isAll ? totalItems : parseInt(itemsPerPage);
        const totalPages = isAll ? 1 : Math.ceil(totalItems / limit);

        if (currentPage > totalPages) currentPage = totalPages || 1;

        const startIndex = isAll ? 0 : (currentPage - 1) * limit;
        const endIndex = isAll ? totalItems : Math.min(startIndex + limit, totalItems);
        const paginatedItems = filtered.slice(startIndex, endIndex);

        tbody.innerHTML = paginatedItems.map(book => {
          const isAvail = (book.status || "Available") === "Available";
          const borrowerInfo = !isAvail && book.borrowerflat ? book.borrowerflat : "-";
          const addedBy = book.addedbyflat || "-";

          return `
            <tr>
              <td data-label="Book Title"><strong>${book.title || ""}</strong></td>
              <td data-label="Author">${book.author || "-"}</td>
              <td data-label="Genre">${book.genre || "-"}</td>
              <td data-label="Added By">${addedBy}</td>
              <td data-label="Status"><span style="color: ${isAvail ? 'var(--success)' : 'var(--danger)'}; font-weight: bold;">${book.status || "Available"}</span></td>
              <td data-label="Borrower">${borrowerInfo}</td>
              <td data-label="Action">
                <button
                  style="background:${isAvail ? 'var(--success)' : 'var(--secondary)'}; color:white; border:none;"
                  onclick="handleAction('${encodeURIComponent(book.title || "")}', '${encodeURIComponent(book.author || "")}', ${isAvail})">
                  ${isAvail ? 'Borrow' : 'Return'}
                </button>
              </td>
            </tr>
          `;
        }).join("");

        updatePaginationControls(totalItems);
      }

      function updatePaginationControls(totalItems) {
        const pageInfo = document.getElementById("pageInfo");
        const prevBtn = document.getElementById("prevPageBtn");
        const nextBtn = document.getElementById("nextPageBtn");

        if (totalItems === 0) {
          pageInfo.textContent = "0 of 0";
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          return;
        }

        const isAll = itemsPerPage === "all";
        const limit = isAll ? totalItems : parseInt(itemsPerPage);
        const totalPages = isAll ? 1 : Math.ceil(totalItems / limit);

        pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${totalItems} items)`;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages || isAll;
      }

      function changePage(direction) {
        currentPage += direction;
        renderCatalog();
      }

      document.getElementById("itemsPerPage").addEventListener("change", (e) => {
        itemsPerPage = e.target.value === "all" ? "all" : parseInt(e.target.value);
        currentPage = 1;
        renderCatalog();
      });

      function handleAction(encodedTitle, encodedAuthor, isAvail) {
        const title = decodeURIComponent(encodedTitle);
        const author = decodeURIComponent(encodedAuthor);
        if (isAvail) {
          activeBook = { title, author };
          document.getElementById("modalBookTitle").textContent = author ? `"${title}" by ${author}` : `"${title}"`;
          document.getElementById("borrowModal").style.display = "flex";
        } else {
          if (confirm(`Return "${title}" to the library?`)) {
            submitStatusUpdate(title, author, "");
          }
        }
      }

      function closeModal() {
        document.getElementById("borrowModal").style.display = "none";
        document.getElementById("flatNumber").value = "";
        activeBook = null;
      }

      document.getElementById("confirmBorrowBtn").addEventListener("click", async () => {
        const flat = document.getElementById("flatNumber").value.trim();
        if (!flat) return alert("Please fill in your flat number.");
        await submitStatusUpdate(activeBook.title, activeBook.author, flat);
        closeModal();
      });

      async function submitStatusUpdate(title, author, flatNumber = "") {
        const payload = { action: "toggleStatus", title, author, flatNumber };
        try {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          await loadBooks();
        } catch (err) {
          alert("Operation failed.");
        }
      }

      document.getElementById("bookForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "Saving...";
        const payload = {
          title: document.getElementById("title").value.trim(),
          author: document.getElementById("author").value.trim(),
          genre: document.getElementById("genre").value.trim(),
          addedByFlat: document.getElementById("addedByFlat").value.trim()
        };
        try {
          await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          document.getElementById("bookForm").reset();
          await loadBooks();
        } catch (err) {
          alert("Failed to add book.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Add Book to Library";
        }
      });

      document.getElementById("searchInput").addEventListener("input", () => {
        currentPage = 1;
        renderCatalog();
      });
      
      document.getElementById("genreFilter").addEventListener("change", () => {
        currentPage = 1;
        renderCatalog();
      });
      
      document.getElementById("availableOnlyToggle").addEventListener("change", () => {
        currentPage = 1;
        renderCatalog();
      });
      
      loadBooks();
    </script>
  </body>
</html>
